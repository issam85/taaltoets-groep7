<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Oefentoets taal groep 7</title>
<meta name="description" content="Oefen werkwoorden, grammatica, komma's en leestekens voor groep 7.">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a37; --mute:#5d6b7a; --line:#d9d2c3;
  --acc:#1d5fa8; --acc-ink:#fff; --acc-soft:#e3eefb;
  --ok:#1f7a45; --ok-bg:#dff3e6; --no:#b3311f; --no-bg:#fbe3df; --sel:#ffe9a8;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.7rem;line-height:1.2;margin:8px 0 6px}
h2{font-size:1.25rem;margin:0 0 4px}
p{margin:0 0 12px}
.mute{color:var(--mute)}
.small{font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
.group{margin:26px 0 8px;font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.part{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 8px}
.part:hover,.part:focus-visible{border-color:var(--acc);outline:none}
.part b{display:block}
.part span.s{display:block;color:var(--mute);font-size:.9rem}
.part .grow{flex:1;min-width:0}
.part .best{font-size:.85rem;font-weight:600;color:var(--ok);white-space:nowrap}
.part.mix{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.part.mix span.s{color:#d6e6f8}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.back{background:none;border:0;padding:6px 0;color:var(--acc);font-weight:600}
.count{margin-left:auto;color:var(--mute);font-size:.9rem;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px}
.tag{display:inline-block;background:var(--acc-soft);color:var(--acc);font-size:.8rem;font-weight:700;border-radius:20px;padding:3px 10px;margin-bottom:10px}
.instr{font-weight:600;margin-bottom:14px}
.sent{font-size:1.3rem;line-height:1.9;margin-bottom:16px}
.inf{color:var(--mute);font-size:1rem;white-space:nowrap}
input.gap{font:inherit;font-size:1.2rem;width:9.5em;max-width:100%;padding:4px 10px;border:2px solid var(--acc);border-radius:10px;background:#fff;color:var(--ink)}
input.gap:focus{outline:3px solid var(--acc-soft)}
input.gap.ok{border-color:var(--ok);background:var(--ok-bg)}
input.gap.no{border-color:var(--no);background:var(--no-bg)}
.w{display:inline-block;font:inherit;font-size:1.2rem;line-height:1.3;background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 9px;margin:0 3px 8px 0}
.w.on{background:var(--sel);border-color:#c79a12}
.w.ok{background:var(--ok-bg);border-color:var(--ok)}
.w.no{background:var(--no-bg);border-color:var(--no)}
.w.miss{border-color:var(--ok);border-style:dashed}
.w:disabled{cursor:default;color:var(--ink);opacity:1}
.marks{display:flex;gap:10px;margin-bottom:16px}
.mark{flex:1;font-size:1.8rem;font-weight:700;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 0}
.mark small{display:block;font-size:.8rem;font-weight:500;color:var(--mute)}
.mark.ok{background:var(--ok-bg);border-color:var(--ok)}
.mark.no{background:var(--no-bg);border-color:var(--no)}
.mark:disabled{cursor:default;color:var(--ink)}
.go{display:block;width:100%;background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:13px;font-weight:700;font-size:1.05rem}
.go:disabled{opacity:.45;cursor:default}
.fb{border-radius:12px;padding:12px 14px;margin:0 0 14px}
.fb.ok{background:var(--ok-bg);color:#124d2b}
.fb.no{background:var(--no-bg);color:#6e1d12}
.fb b{display:block;margin-bottom:2px}
.score{font-size:3rem;font-weight:800;line-height:1.1;margin:6px 0}
.wrong{border-top:1px solid var(--line);padding:12px 0}
.wrong:first-of-type{border-top:0}
.wrong .q{font-weight:600}
.wrong .y{color:var(--no)}
.wrong .g{color:var(--ok)}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.row .go{flex:1;min-width:150px}
.go.alt{background:var(--card);color:var(--acc);border:2px solid var(--acc)}
</style>
</head>

var app = document.getElementById('app');
var run = null;

function h(tag, attrs, kids){
  var e = document.createElement(tag), k;
  for (k in (attrs || {})){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'text') e.textContent = attrs[k];
    else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)), x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function best(id, val){
  try {
    var all = JSON.parse(localStorage.getItem('taaltoets') || '{}');
    if (val !== undefined){ if (!(all[id] >= val)) { all[id] = val; localStorage.setItem('taaltoets', JSON.stringify(all)); } }
    return all[id];
  } catch (e) { return undefined; }
}
// "[De oude hond] slaapt" wordt een lijst woorden met een vlag voor het goede antwoord
function words(s){
  var marked = s.replace(/\[([^\]]+)\]/g, function(m, g){ return g.split(' ').map(function(w){ return '~' + w; }).join(' '); });
  return marked.split(' ').map(function(w){ return w.charAt(0) === '~' ? {w: w.slice(1), a: true} : {w: w, a: false}; });
}
function plain(s){ return s.replace(/[\[\]]/g, ''); }
function bare(w){ return w.replace(/[.,?!]/g, ''); }

  run = null;
  app.innerHTML = '';
  app.appendChild(h('h1', {text: 'Oefentoets taal groep 7'}));
  app.appendChild(h('p', {class: 'mute', text: 'Kies een onderdeel. Na elke vraag zie je meteen of het goed is, met uitleg erbij.'}));
  var total = 0; PARTS.forEach(function(p){ total += p.qs.length; });
  app.appendChild(partBtn({id: 'mix', title: 'Alles door elkaar', sub: '20 vragen uit alle onderdelen', n: 20}, true));
  var g = '';
  PARTS.forEach(function(p){
    if (p.group !== g){ g = p.group; app.appendChild(h('div', {class: 'group', text: g})); }
    app.appendChild(partBtn({id: p.id, title: p.title, sub: p.sub, n: p.qs.length}, false));
  });
  app.appendChild(h('p', {class: 'mute small', text: 'In totaal ' + total + ' vragen. Er wordt niets opgestuurd of bewaard, behalve je beste score op dit apparaat.'}));
  window.scrollTo(0, 0);
}
function partBtn(o, mix){
  var b = best(o.id);
  return h('button', {class: 'part' + (mix ? ' mix' : ''), onclick: function(){ start(o.id); }}, [
    h('span', {class: 'grow'}, [h('b', {text: o.title}), h('span', {class: 's', text: o.sub + (mix ? '' : ' · ' + o.n + ' vragen')})]),
    b !== undefined && !mix ? h('span', {class: 'best', text: 'beste: ' + b + '/' + o.n}) : null
  ]);
}

function start(id){
  var qs = [], title;
  if (id === 'mix'){
    title = 'Alles door elkaar';
    PARTS.forEach(function(p){ shuffle(p.qs).slice(0, 2).forEach(function(q){ qs.push({q: q, p: p}); }); });
    qs = shuffle(qs);
  } else {
    var p = PARTS.filter(function(x){ return x.id === id; })[0];
    title = p.title;
    qs = shuffle(p.qs).map(function(q){ return {q: q, p: p}; });
  }
  run = {id: id, title: title, qs: qs, i: 0, good: 0, wrong: []};
  draw();
}

function draw(){
  var item = run.qs[run.i], q = item.q, p = item.p;
  app.innerHTML = '';
  app.appendChild(h('div', {class: 'top'}, [
    h('button', {class: 'back', text: '‹ Onderdelen', onclick: home}),
    h('span', {class: 'count', text: 'Vraag ' + (run.i + 1) + ' van ' + run.qs.length})
  ]));
  var bar = h('i'); bar.style.width = (run.i / run.qs.length * 100) + '%';
  app.appendChild(h('div', {class: 'bar'}, [bar]));
  var card = h('div', {class: 'card'});
  app.appendChild(card);
  card.appendChild(h('div', {class: 'tag', text: p.title}));
  card.appendChild(h('div', {class: 'instr', text: q.i || p.instr}));
  var sent = h('div', {class: 'sent'});
  card.appendChild(sent);
  var fb = h('div');
  var go = h('button', {class: 'go', text: 'Controleer'});
  var done = false, getAnswer, canCheck = function(){ return true; }, lock;

  function finish(ok, given, right){
    done = true;
    if (ok) run.good++; else run.wrong.push({q: q, p: p, given: given, right: right});
    fb.className = 'fb ' + (ok ? 'ok' : 'no');
    fb.appendChild(h('b', {text: ok ? 'Goed!' : 'Niet goed. Het goede antwoord: ' + right}));
    fb.appendChild(document.createTextNode(q.u));
    go.textContent = run.i + 1 < run.qs.length ? 'Volgende vraag' : 'Bekijk je score';
    go.disabled = false;
    go.focus();
  }
  go.addEventListener('click', function(){
    if (done){ run.i++; if (run.i < run.qs.length) draw(); else end(); return; }
    if (!canCheck()) return;
    getAnswer();
  });

  if (q.t === 'typ'){
    var parts = q.s.split('___');
    var inp = h('input', {class: 'gap', type: 'text', autocomplete: 'off', autocapitalize: 'off', autocorrect: 'off', spellcheck: 'false', 'aria-label': 'Jouw antwoord'});
    if (parts[0]) sent.appendChild(document.createTextNode(parts[0]));
    sent.appendChild(inp);
    sent.appendChild(document.createTextNode(parts[1] + ' '));
    sent.appendChild(h('span', {class: 'inf', text: '(' + q.inf + ')'}));
    canCheck = function(){ return inp.value.trim() !== ''; };
    go.disabled = true;
    inp.addEventListener('input', function(){ if (!done) go.disabled = !canCheck(); });
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); go.click(); } });
    getAnswer = function(){
      var v = inp.value.trim().replace(/[.?!]$/, '').toLowerCase();
      var ok = v === q.a;
      inp.readOnly = true; inp.classList.add(ok ? 'ok' : 'no');
      finish(ok, inp.value.trim(), q.s.charAt(0) === '_' ? q.a.charAt(0).toUpperCase() + q.a.slice(1) : q.a);
    };
    setTimeout(function(){ inp.focus(); }, 30);
  }
  else if (q.t === 'tik'){
    var ws = words(q.s), multi = !!p.multi, btns = [];
    ws.forEach(function(w, i){
      var b = h('button', {class: 'w', type: 'button', text: w.w, 'aria-pressed': 'false'});
      b.addEventListener('click', function(){
        if (done) return;
        if (!multi) btns.forEach(function(x){ if (x !== b){ x.classList.remove('on'); x.setAttribute('aria-pressed', 'false'); } });
        b.classList.toggle('on');
        b.setAttribute('aria-pressed', b.classList.contains('on') ? 'true' : 'false');
        go.disabled = !canCheck();
      });
      btns.push(b); sent.appendChild(b);
    });
    canCheck = function(){ return btns.some(function(b){ return b.classList.contains('on'); }); };
    go.disabled = true;
    getAnswer = function(){
      var ok = true, given = [], right = [];
      ws.forEach(function(w, i){
        var on = btns[i].classList.contains('on');
        if (on) given.push(bare(w.w));
        if (w.a) right.push(bare(w.w));
        if (on !== w.a) ok = false;
        btns[i].disabled = true;
        btns[i].classList.remove('on');
        if (on && w.a) btns[i].classList.add('ok');
        else if (on) btns[i].classList.add('no');
        else if (w.a) btns[i].classList.add('miss');
      });
      var r = right.join(p.id === 'ow' ? ' ' : ', ');
      if (p.komma) r = ws.map(function(w){ return w.a ? w.w + ',' : w.w; }).join(' ');
      finish(ok, given.join(p.id === 'ow' ? ' ' : ', '), r);
    };
  }
  else {
    sent.appendChild(document.createTextNode(q.s + ' …'));
    var marks = h('div', {class: 'marks'}), chosen = null, mb = [];
    [['.', 'punt'], ['?', 'vraagteken'], ['!', 'uitroepteken']].forEach(function(m){
      var b = h('button', {class: 'mark', type: 'button', 'aria-label': m[1]}, [m[0], h('small', {text: m[1]})]);
      b.addEventListener('click', function(){
        if (done) return;
        chosen = m[0];
        mb.forEach(function(x){ x.b.disabled = true; if (x.m === q.a) x.b.classList.add('ok'); });
        if (chosen !== q.a) b.classList.add('no');
        sent.textContent = q.s + q.a;
        finish(chosen === q.a, m[1], q.s + q.a);
      });
      mb.push({b: b, m: m[0]}); marks.appendChild(b);
    });
    card.appendChild(marks);
    go.disabled = true;
    getAnswer = function(){};
  }
  card.appendChild(fb);
  card.appendChild(go);
  window.scrollTo(0, 0);
}

function end(){
  var n = run.qs.length, g = run.good, pct = g / n;
  if (run.id !== 'mix') best(run.id, g);
  app.innerHTML = '';
  app.appendChild(h('div', {class: 'top'}, [h('button', {class: 'back', text: '‹ Onderdelen', onclick: home})]));
  var card = h('div', {class: 'card'});
  app.appendChild(card);
  card.appendChild(h('div', {class: 'tag', text: run.title}));
  card.appendChild(h('div', {class: 'score', text: g + ' van ' + n}));
  card.appendChild(h('p', {text: pct === 1 ? 'Alles goed. Dit onderdeel ken je.' : pct >= 0.8 ? 'Bijna alles goed. Kijk nog even naar je fouten hieronder.' : pct >= 0.55 ? 'Je bent er bijna. Lees de uitleg bij je fouten en probeer het nog een keer.' : 'Dit onderdeel is nog lastig. Lees de uitleg bij je fouten rustig door en probeer het dan opnieuw.'}));
  var id = run.id;
  card.appendChild(h('div', {class: 'row'}, [
    h('button', {class: 'go', text: 'Nog een keer', onclick: function(){ start(id); }}),
    h('button', {class: 'go alt', text: 'Ander onderdeel', onclick: home})
  ]));
  if (run.wrong.length){
    app.appendChild(h('div', {class: 'group', text: 'Dit ging fout'}));
    var list = h('div', {class: 'card'});
    run.wrong.forEach(function(x){
      list.appendChild(h('div', {class: 'wrong'}, [
        h('div', {class: 'q', text: x.q.t === 'typ' ? x.q.s + ' (' + x.q.inf + ')' : plain(x.q.s)}),
        h('div', {class: 'y', text: 'Jouw antwoord: ' + x.given}),
        h('div', {class: 'g', text: 'Goed is: ' + x.right}),
        h('div', {class: 'mute small', text: x.q.u})
      ]));
    });
    app.appendChild(list);
  }
  window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>
